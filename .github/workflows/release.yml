name: Release

on:
  schedule:
    # Use this command to see what the time is in your local time zone.
    # `date -d '17:00 UTC'`
    - cron: "0 17 3 * *" # Monthly on day 3 at 17:00 UTC (10AM PDT / 9AM PST)
  workflow_dispatch:

# default: least privileged permissions across all jobs
permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'LibreBooking/librebooking'
    runs-on: ubuntu-latest
    concurrency: release
    environment: release

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}

      - name: Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          github_token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          config_file: releaserc.toml
          build: false

      - name: Publish | Upload to GitHub Release Assets
        uses: python-semantic-release/publish-action@v10.6.2
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
