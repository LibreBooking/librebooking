name: Deploy to FTP

on:
  push:
    branches:
      - development # lub master, w zależności od domyślnej gałęzi

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # server-dir: /public_html/ # odkomentuj, jeśli pliki mają trafić do konkretnego podkatalogu
