name: End-to-End Tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      # Building and pulling the images is kept apart from the test steps so
      # their logs show little more than the Playwright results.
      - name: Prepare Docker E2E images
        timeout-minutes: 20
        run: npm run test:e2e:docker:prepare

      # The Playwright container installs its own dependencies and browsers.
      - name: Run Docker E2E tests
        timeout-minutes: 10
        run: npm run test:e2e:docker:test

      - name: Upload Playwright report and failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-results
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove Docker E2E stack
        if: always()
        run: docker compose -p lb-e2e-run -f tests/e2e/docker/docker-compose.yml down -v --remove-orphans
